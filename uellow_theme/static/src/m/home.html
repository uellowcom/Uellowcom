<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
__HEAD__
<style>
:root{
 --y:#F5C320;--yl:#FFD340;--ys:#FFF5D0;--yf:#FFFCEF;--brown:#412402;--brownS:#1F1100;
 --ink:#1A1A1A;--tx:#3F3F3F;--mut:#6B6B6B;--bd:#EFEFEF;--page:#F3F4F6;
 --ok:#10B981;--okd:#047857;--okb:#ECFDF5;--dg:#FF4D4D;--dgr:#d92d2d;--dgd:#B91C1C;--dgb:#FFE3E3;
 --wn:#C99000;--wnb:#FFE8A0;--acc:#1F8A40;
 --sans:'Tajawal','SF Arabic','Segoe UI',system-ui,-apple-system,'Noto Kufi Arabic','Tahoma',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);line-height:1.3}
a{color:inherit;text-decoration:none}img{display:block}
.tnum{font-variant-numeric:tabular-nums}
.ssr-wrap{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sk{background:#ececec;animation:skp 1.2s ease-in-out infinite;border-radius:12px}
@keyframes skp{0%,100%{opacity:1}50%{opacity:.5}}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:34px}
/* header */
.hdr{position:sticky;top:0;z-index:60;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.05);display:flex;align-items:center;gap:9px;padding:9px 12px}
.hdr .logo{display:flex;align-items:center;height:34px;font-weight:900;font-size:19px;color:var(--brown)}
.hdr .logo img{height:30px;width:auto;max-width:100px;object-fit:contain}
.hdr .srch{flex:1;display:flex;align-items:center;gap:7px;background:#F2F3F5;border:1px solid #EAEBED;border-radius:999px;padding:9px 13px;color:#6b7280;font-size:13px;font-weight:600}
.hdr .ic{width:38px;height:38px;border-radius:12px;background:#F2F3F5;display:grid;place-items:center;font-size:17px;position:relative}
.hdr .badge{position:absolute;top:-3px;left:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--dgr);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center}
/* section header */
.sh{display:flex;align-items:flex-start;gap:8px;padding:6px 14px}
.sh .ti{font-weight:900;font-size:16px;color:var(--brown);line-height:1.15}
.sh .su{font-weight:500;font-size:11.5px;color:rgba(65,36,2,.55);margin-top:2px}
.sh .more{margin-inline-start:auto;background:var(--y);color:var(--brown);font-weight:900;font-size:9px;padding:4px 9px;border-radius:999px;white-space:nowrap;align-self:center}
/* rails/grids */
.rail{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 14px 2px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:0 0 auto;scroll-snap-align:start}
.grid{display:grid;gap:8px;padding:0 12px}
/* rich product card */
.card{width:100%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative;display:block}
.card .iw{position:relative;aspect-ratio:1;background:#FAFAFA;overflow:hidden}
.card .iw img{width:100%;height:100%;object-fit:cover}
.card .hrt{position:absolute;inset-inline-end:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:13px;color:var(--mut);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.card .vid{position:absolute;inset-inline-start:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.72);display:grid;place-items:center;color:#fff;font-size:11px}
.card .in{padding:4px 8px 6px}
.card .nm{font-size:11px;font-weight:700;color:var(--ink);line-height:1.25;height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .pr{display:flex;align-items:center;gap:3px;margin-top:2px;flex-wrap:wrap}
.card .am{font-size:13.5px;font-weight:900;color:var(--ink)}.card .sy{font-size:9px;font-weight:700;color:var(--mut)}
.card .cm{font-size:9px;color:rgba(0,0,0,.55);text-decoration:line-through;margin-inline-start:3px}
.card .dp{background:var(--dgr);color:#fff;font-size:8.5px;font-weight:900;border-radius:3px;padding:1.5px 4px;margin-inline-start:3px}
.card .st{display:flex;align-items:center;gap:1px;height:14px;margin-top:3px;font-size:10px}
.card .st .f{color:#FFC107}.card .st .e{color:#CFCFCF}.card .st .c{font-size:9px;color:var(--mut);margin-inline-start:2px}
.card .av{display:inline-block;margin-top:4px;border-radius:4px;padding:2px 7px;font-size:9.5px;font-weight:900}
.av1{background:var(--okb);color:var(--okd)}.av2{background:var(--wnb);color:var(--wn)}.av3{background:var(--dgb);color:var(--dgd)}
/* tab-nav */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 10px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--brown);white-space:nowrap}
.tab.u{margin-inline-end:18px;padding:4px 0;border-bottom:2.5px solid transparent}.tab.u.on{font-weight:900;border-color:var(--y)}
.tab.p{padding:6px 14px;border-radius:16px;background:#fff;border:1px solid #E5DCC2}.tab.p.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.tab.b{padding:6px 12px;border-radius:12px;background:#fff;border:1px solid #E5DCC2}.tab.b.on{background:var(--ys);border-color:var(--y);font-weight:900}
/* slider */
.slider{padding:0 12px}.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px}.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;background:linear-gradient(135deg,#412402,#6b3a05,#F5C320)}
.slide img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.slide .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:18px;color:#fff}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.dots i{width:6px;height:6px;border-radius:50%;background:#D5D5D5}.dots i.on{background:var(--brown);width:16px;border-radius:3px}
/* trust */
.trust{display:flex;margin:0 10px;padding:6px 8px;border-radius:10px;background:#fff}
.trust .t{flex:1;text-align:center;font-size:10px;font-weight:700;color:rgba(65,36,2,.85)}.trust .t .e{font-size:13px;display:block;margin-bottom:2px}
.trust .sep{width:1px;height:26px;background:#E5E5E5;align-self:center}
.trustc{display:flex;gap:8px;overflow-x:auto;padding:2px 10px}.trustc::-webkit-scrollbar{display:none}
.trustc .p{flex:0 0 auto;background:#F7F7F7;border:1px solid #EAEAEA;border-radius:999px;padding:6px 12px;font-size:10.5px;font-weight:700;white-space:nowrap}
/* cats */
.cats{display:grid;gap:10px;padding:4px 12px}
.cat{text-align:center}.cat .ci{width:100%;aspect-ratio:1;overflow:hidden;background:#EFEFEF;display:grid;place-items:center;font-size:24px}
.cat.circle .ci{border-radius:50%}.cat.square .ci{border-radius:8px}.cat.rounded .ci{border-radius:16px}
.cat .ci img{width:100%;height:100%;object-fit:cover}
.cat .cl{font-size:10.5px;font-weight:600;color:var(--brown);margin-top:5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.catrail{display:flex;gap:10px;overflow-x:auto;padding:4px 12px}.catrail::-webkit-scrollbar{display:none}.catrail .catrail .cat{flex:0 0 auto;width:72px}.cats .cat{width:auto}.cats .cat .ci{width:100%;max-width:none}
/* panel (promo) */
.panel{margin:4px 10px;border-radius:18px;overflow:hidden;border:1px solid #EDEDED;background:#fff}
.ph{display:flex;align-items:center;gap:9px;padding:9px 9px 7px 11px}
.ph .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.ph .pt{font-size:13.5px;font-weight:900}.ph .ps{font-size:10.5px;opacity:.9}
.ph .all{margin-inline-start:auto;color:var(--brown);font-weight:900;font-size:10.5px;padding:5px 10px;border-radius:999px;white-space:nowrap}
.phero{display:flex;gap:10px;border-radius:14px;padding:10px;margin-bottom:10px}
.phero .im{flex:0 0 42%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff}.phero .im img{width:100%;height:100%;object-fit:cover}
.phero .dt{flex:1;display:flex;flex-direction:column;justify-content:center}
.phero .bd{align-self:flex-start;color:#fff;font-size:9.5px;font-weight:900;border-radius:999px;padding:3px 9px;margin-bottom:6px}
.phero .nm{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.3;max-height:36px;overflow:hidden}.phero .pp{font-size:18px;font-weight:900;margin-top:6px}
.lead{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;margin-bottom:8px;background:#F8F8F8;border:1px solid #EFEFEF}
.lead .rk{font-size:18px;width:26px;text-align:center}.lead img{width:52px;height:52px;border-radius:8px;object-fit:cover}
.lead .ln{flex:1;font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;max-height:34px}.lead .lp{font-size:14px;font-weight:900}
.arrib{position:absolute;top:0;inset-inline-end:0;color:#fff;font-size:9.5px;font-weight:900;padding:3px 8px;border-bottom-left-radius:10px}
/* hero */
.hero{margin:8px 12px;height:180px;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.12);background:linear-gradient(135deg,#412402,#6b3a05,#F5C320)}
.hero img{width:100%;height:100%;object-fit:cover}.hero .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 60%)}
.hero .hc{position:absolute;inset-inline:0;bottom:0;padding:16px 18px}
.hero .ht{color:#fff;font-size:22px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.5)}.hero .hs{color:rgba(255,255,255,.92);font-size:13px;margin-top:3px}
.hero .hb{display:inline-block;margin-top:10px;background:var(--y);color:var(--brown);font-weight:900;font-size:12px;padding:8px 14px;border-radius:20px}
/* sticky cta */
.scta{margin:0 8px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:12px 14px}
.scta .lb{font-size:12.5px;font-weight:700;flex:1}.scta .cta{font-size:11px;font-weight:900;padding:6px 12px;border-radius:16px}
/* bestsellers arena */
.arena{margin:0 10px;padding:12px;border-radius:18px;border:1px solid rgba(255,215,94,.2);background:linear-gradient(135deg,#2C1801,#5A3A0E,#2C1801);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.arena .ah{display:flex;align-items:center;gap:7px;margin-bottom:10px}.arena .ah .at{color:#FFD75E;font-size:15px;font-weight:900}
.arena .ah .lv{margin-inline-start:auto;background:rgba(255,255,255,.15);border-radius:999px;padding:3px 9px;font-size:9.5px;color:#fff;font-weight:800;display:flex;align-items:center;gap:4px}.arena .ah .lv i{width:6px;height:6px;border-radius:50%;background:#7BE495}
.arena .ar{display:flex;gap:8px;overflow-x:auto}.arena .ar::-webkit-scrollbar{display:none}
.champ{flex:0 0 auto;width:158px;border-radius:14px;overflow:hidden;position:relative;border:2px solid #FFD75E;box-shadow:0 0 18px rgba(212,175,55,.35)}
.champ img{width:100%;height:158px;object-fit:cover}.champ .cr{position:absolute;top:8px;inset-inline-start:8px;background:linear-gradient(135deg,#FFE082,#D4AF37);color:#4A2E04;font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px}
.champ .vl{position:absolute;inset-inline:0;bottom:0;padding:8px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.champ .cn{color:#fff;font-size:11px;font-weight:700;line-height:1.2;max-height:26px;overflow:hidden}.champ .cp{color:#FFD75E;font-size:13px;font-weight:900;margin-top:2px}
.chase{flex:0 0 auto;width:122px;background:#fff;border-radius:12px;overflow:hidden;position:relative}.chase img{width:100%;height:122px;object-fit:cover}
.chase .md{position:absolute;top:6px;inset-inline-start:6px;background:rgba(74,46,4,.7);color:#fff;font-size:9px;font-weight:900;border-radius:999px;padding:2px 7px}
.chase .ci{padding:6px 8px 8px}.chase .cn{font-size:9.5px;font-weight:700;color:#1F1206;height:24px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.chase .cp{font-size:11.5px;font-weight:900;color:#4A2E04;margin-top:2px}
/* pills */
.pills{display:flex;gap:8px;padding:4px 12px}.pills.g{display:grid;grid-template-columns:1fr 1fr}
.pill{display:flex;align-items:center;gap:8px;padding:10px 9px;border-radius:10px;position:relative}.pill .pe{font-size:18px}.pill .pt{font-size:12px;font-weight:900}.pill .pss{font-size:10.5px;opacity:.65}
/* themed */
.tp{width:175px;border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column}.tp .tt{font-size:13.5px;font-weight:900;color:var(--brown)}.tp .ts{font-size:11px;font-weight:600;color:rgba(65,36,2,.65);margin-top:2px}.tp .ti{flex:1;margin-top:8px;border-radius:8px;overflow:hidden;min-height:80px}.tp .ti img{width:100%;height:100%;object-fit:cover}
/* vendors */
.vend{width:100px;padding:8px;background:#fff;border-radius:10px;border:1px solid rgba(65,36,2,.08);text-align:center}
.vend .vl{width:48px;height:48px;border-radius:50%;margin:0 auto;overflow:hidden;background:rgba(245,195,32,.2);display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--brown)}.vend .vl img{width:100%;height:100%;object-fit:cover}
.vend .vn{font-size:11px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vend .vr{font-size:10px;font-weight:800;color:rgba(245,195,32,.95)}
/* bundle */
.bundle{margin:4px 10px;padding:14px 14px 16px;border-radius:20px}
.bundle .bh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bundle .bt{color:#fff;font-size:17px;font-weight:900}.bundle .bs{color:#EDE9FE;font-size:12px}
.bcard{flex:0 0 auto;width:164px;background:#fff;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 4px 8px rgba(0,0,0,.1)}.bcard img{width:100%;aspect-ratio:1;object-fit:cover}
.bcard .b1{position:absolute;top:8px;inset-inline-start:8px;background:#7C3AED;color:#fff;font-size:9px;font-weight:900;border-radius:999px;padding:3px 8px}.bcard .b2{position:absolute;top:8px;inset-inline-end:8px;background:#16A34A;color:#fff;font-size:9px;font-weight:900;border-radius:999px;padding:3px 8px}
.bcard .bi{padding:7px 9px 9px}.bcard .bn{font-size:11px;font-weight:700;color:var(--ink);height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.bcard .bp{font-size:14px;font-weight:900;color:#7C3AED;margin-top:2px}
/* flash */
.flash{margin:4px 8px 8px;border-radius:18px;padding:12px;position:relative;overflow:hidden}
.flash.classic{background:linear-gradient(135deg,#FFD340,#F59E0B 55%,#EA580C)}
.flash.dark{background:linear-gradient(135deg,#0F0F0F,#1A1A1A,#2A0F00);box-shadow:0 6px 20px rgba(255,69,0,.35)}
.flash.royal{background:linear-gradient(135deg,#2E1065,#4C1D95,#6D28D9);box-shadow:0 6px 20px rgba(76,29,149,.33)}
.flash.minimal{background:transparent;padding:6px 0}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.fh .ft{font-weight:900;color:#fff;font-size:13.5px}.flash.minimal .ft{color:#1F1206}
.cd{margin-inline-start:auto;display:flex;gap:4px}.cd .u{min-width:22px;height:24px;padding:0 3px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:900;font-variant-numeric:tabular-nums}
.flash.classic .cd .u{background:rgba(0,0,0,.8);color:#fff}.flash.dark .cd .u,.flash.royal .cd .u{background:#FFD340;color:#000}.flash.minimal .cd .u{background:#C0392B;color:#fff}
.fcard{flex:0 0 auto;width:130px;background:#fff;border-radius:14px;overflow:hidden;position:relative}.fcard img{width:100%;aspect-ratio:1;object-fit:cover}
.fcard .fd{position:absolute;top:8px;inset-inline-end:8px;background:linear-gradient(135deg,#E53935,#B71C1C);color:#fff;font-size:8.5px;font-weight:900;border-radius:999px;padding:2.5px 6px}
.fcard .fi{padding:6px 8px 8px}.fcard .fp{font-size:13.5px;font-weight:900;color:var(--dg)}.fcard .fs{font-size:8.5px;color:#C62828}
.fcard .fv{display:block;text-align:center;margin-top:4px;background:linear-gradient(135deg,#E6F7EF,#D4F0DD);border:1px solid rgba(4,120,87,.18);color:#047857;font-size:9px;font-weight:900;border-radius:4px;padding:2px}
/* reels */
.reel{flex:0 0 auto;text-align:center}
.reel.bub .rb{width:62px;height:62px;border-radius:50%;overflow:hidden;border:2.5px solid var(--y);position:relative;background:#fff}
.reel.card .rb{width:118px;height:170px;border-radius:14px;overflow:hidden;position:relative;background:#eee}
.reel.sq .rb{width:96px;height:96px;border-radius:16px;overflow:hidden;position:relative;background:#eee}
.reel .rb img{width:100%;height:100%;object-fit:cover}
.reel .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.reel .rn{position:absolute;inset-inline:0;bottom:0;padding:14px 6px 5px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);color:#fff;font-size:9.5px;font-weight:700;text-align:start}
/* text/divider/newsletter */
.tblock{padding:6px 16px;font-size:13.5px;color:var(--tx);line-height:1.6}
.divb{height:1px;background:#E9E9E9;margin:10px 16px}

.reel{cursor:pointer}.reel.card .rb{width:112px;height:150px}.reels-tight .rail,.rail{gap:8px}

/* functional search input */
.srch{cursor:text}.srch .si{flex:0 0 auto}.srch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--brown)}.srch input::placeholder{color:#9aa0a6}
/* Beena AI chat */
