<!-- uellow mobile product page — app-faithful replica. SSR head+critical body, hydrated from window.__P__ -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
__HEAD__
<style>
@font-face{font-family:'Tajawal';font-weight:400;font-display:swap;src:url('/uellow_documents/static/src/fonts/Tajawal-Regular.ttf') format('truetype')}
@font-face{font-family:'Tajawal';font-weight:500;font-display:swap;src:url('/uellow_documents/static/src/fonts/Tajawal-Regular.ttf') format('truetype')}
@font-face{font-family:'Tajawal';font-weight:700;font-display:swap;src:url('/uellow_documents/static/src/fonts/Tajawal-Bold.ttf') format('truetype')}
@font-face{font-family:'Tajawal';font-weight:800;font-display:swap;src:url('/uellow_documents/static/src/fonts/Tajawal-Bold.ttf') format('truetype')}
@font-face{font-family:'Tajawal';font-weight:900;font-display:swap;src:url('/uellow_documents/static/src/fonts/Tajawal-Bold.ttf') format('truetype')}
:root{
  --y:#ffd400;--y2:#ffc400;--y-ink:#1a1600;--ink:#14171a;--muted:#6b7280;--soft:#9aa0a6;
  --bg:#f4f5f7;--card:#fff;--line:#eef0f2;--ok:#12b76a;--red:#e5484d;--blue:#2563eb;--teal:#0e9384;
  --rad:18px;--sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Tajawal','Noto Kufi Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
s{text-decoration:line-through}
.wrap{max-width:540px;margin:0 auto;padding-bottom:calc(150px + var(--safe-b))}
/* ===== sticky search header ===== */
.hdr{position:sticky;top:0;z-index:44;display:flex;align-items:center;gap:9px;
  padding:calc(8px + var(--safe-t)) 12px 8px;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line)}
.hbtn{position:relative;width:42px;height:42px;border-radius:13px;background:#f4f5f7;display:grid;place-items:center;flex:0 0 auto;transition:.15s}
.hbtn:active{transform:scale(.94)}
.hbtn svg{width:22px;height:22px}
.hbtn.on svg{fill:var(--red);stroke:var(--red)}
.hsearch{flex:1;height:42px;border-radius:13px;background:#f4f5f7;display:flex;align-items:center;gap:9px;padding:0 14px;color:var(--soft);font-size:13.5px;font-weight:600}
.hsearch svg{width:18px;height:18px;color:var(--soft);flex:0 0 auto}
.hbadge{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 4px;box-shadow:0 2px 6px rgba(229,72,77,.4)}
/* SSR critical (hidden once JS mounts) */
#ssr{padding:14px}#ssr.hide{display:none}
.ssr-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:14px}
.ssr-title{font-size:20px;font-weight:800;line-height:1.5;margin:14px 0 8px}
.ssr-crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.ssr-now{font-size:26px;font-weight:900}.ssr-cur{font-size:14px;color:var(--muted);font-weight:700}
.ssr-was{font-size:14px;color:var(--muted);margin-inline-start:8px}.ssr-off{color:var(--red);font-weight:800;font-size:13px}
.ssr-stock{margin:10px 0;font-weight:700;color:var(--ok);font-size:13px}
.ssr-desc{font-size:14px;line-height:1.9;color:#374151}
/* skeleton */
.sk{background:linear-gradient(100deg,#e9ebee 30%,#f4f5f7 50%,#e9ebee 70%);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:12px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* cards & sections */
.card{background:var(--card);margin:9px 11px;padding:15px;border-radius:var(--rad);box-shadow:var(--sh)}
.card.tight{padding:12px 14px}
.sec-t{font-size:15.5px;font-weight:800;margin:0 0 11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-t .go{font-size:12.5px;color:var(--muted);font-weight:700}
.fade{opacity:0;transform:translateY(8px);animation:fin .38s ease forwards}
@keyframes fin{to{opacity:1;transform:none}}
.svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* ===== gallery + appbar ===== */
.gal{position:relative;background:#fff;overflow:hidden}
.gal-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:380px;
  touch-action:pan-x;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.gal-track::-webkit-scrollbar{display:none}
.gal-count{position:absolute;top:14px;left:14px;z-index:4;background:rgba(20,23,26,.62);color:#fff;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;direction:ltr}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gal-nav svg{width:20px;height:20px;stroke:#14171a}
.gal-nav.prev{right:12px}.gal-nav.next{left:12px}.gal-nav.next svg{transform:scaleX(-1)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:90;background:rgba(8,10,14,.97);display:flex;flex-direction:column;opacity:0;animation:fin .2s forwards}
.lb-x{position:absolute;top:calc(12px + var(--safe-t));left:14px;z-index:3;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.lb-x svg{width:24px;height:24px;stroke:#fff;color:#fff}
.lb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;padding:24px}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain}
.lb-count{position:absolute;bottom:calc(20px + var(--safe-b));left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:700;direction:ltr}
.lb-video{flex:1;display:flex;align-items:center;justify-content:center}
.lb-video iframe,.lb-video video{width:100%;max-height:72vh;border:0}
/* live search overlay */
.search-ov{position:fixed;inset:0;z-index:85;background:#fff;display:flex;flex-direction:column;opacity:0;animation:fin .2s forwards}
.search-top{display:flex;align-items:center;gap:9px;padding:calc(8px + var(--safe-t)) 12px 8px;border-bottom:1px solid var(--line)}
.search-in{flex:1;height:42px;border-radius:13px;background:#f4f5f7;border:1.5px solid transparent;padding:0 14px;font-family:inherit;font-size:14px;font-weight:600}
.search-in:focus{outline:none;border-color:var(--y);background:#fff}
.search-cancel{font-size:13.5px;font-weight:800;color:var(--muted);flex:0 0 auto;padding:0 4px}
.search-res{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.sr-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.sr-row:active{background:#f8f9fb}
.sr-row img{width:52px;height:52px;border-radius:11px;object-fit:contain;background:#f6f7f9;flex:0 0 auto}
.sr-nm{flex:1;font-size:13px;font-weight:600;line-height:1.45;max-height:38px;overflow:hidden}
.sr-p{font-size:13.5px;font-weight:900;flex:0 0 auto}.sr-p small{font-size:10px;color:var(--muted);font-weight:700}
.sr-hint{text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;padding:44px 20px}
.gal-slide{flex:0 0 100%;scroll-snap-align:center;position:relative;background:#fff}
.gal-slide img{width:100%;height:100%;object-fit:contain;padding:8px}
.gal-off{position:absolute;top:14px;right:14px;z-index:4;background:var(--red);color:#fff;font-size:13px;font-weight:900;padding:5px 11px;border-radius:11px;box-shadow:0 4px 12px rgba(229,72,77,.4)}
.gal-slide.vid::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.18)}
.gal-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gal-play svg{width:26px;height:26px;fill:#14171a;margin-inline-start:3px}
.gal-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.gal-dot{width:6px;height:6px;border-radius:3px;background:rgba(20,23,26,.22);transition:.2s}
.gal-dot.on{width:20px;background:var(--ink)}
.gal-vpill{position:absolute;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(20,23,26,.72);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;display:flex;gap:6px;align-items:center}
.gal-vpill svg{width:14px;height:14px;fill:#fff}
.appbar{position:absolute;top:calc(10px + var(--safe-t));left:12px;right:12px;z-index:6;display:flex;align-items:center;justify-content:space-between}
.ab-r{display:flex;gap:8px}
.ab-btn{position:relative;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.ab-btn svg{width:22px;height:22px}
.ab-btn.on svg{fill:var(--red);stroke:var(--red)}
.ab-badge{position:absolute;top:-3px;left:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;
  font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
/* ===== banners ===== */
.banner{margin:0;padding:12px 16px;display:flex;align-items:center;gap:12px;color:#fff;font-weight:800}
.banner .cd{margin-inline-start:auto;display:flex;gap:5px}
.banner .cd b{background:rgba(0,0,0,.25);border-radius:7px;padding:4px 7px;font-size:14px;font-variant-numeric:tabular-nums}
/* ===== title ===== */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.mchip{font-size:11.5px;font-weight:700;color:#4b5563;background:#f2f3f5;border-radius:8px;padding:4px 9px;display:flex;gap:5px;align-items:center}
.mchip svg{width:13px;height:13px}
.p-title{font-size:20px;font-weight:800;line-height:1.55;margin:0}
.stars{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px}
.stars .sicon{display:inline-flex;gap:1px}.stars svg{width:15px;height:15px;fill:#ffb300}
.trend{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:8px}
.trend.up{background:#ffe9ea;color:var(--red)}.trend.down{background:#eafaf1;color:#0a8a4f}.trend.low{background:#fff4d6;color:#8a6d00}
.trophy{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff8e1,#fffdf5);border:1px solid #f2e2a0;
  border-radius:12px;padding:9px 12px;margin-top:12px;font-size:13px;font-weight:800;color:#8a6d00}
.trophy svg{width:18px;height:18px;fill:#e6a700}
/* ===== price ===== */
.pricebox{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.p-now{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1}
.p-cur{font-size:15px;font-weight:800;color:var(--muted)}
.p-was{font-size:15px;color:var(--soft);margin-bottom:3px}
.p-off{background:#ffe9ea;color:var(--red);font-size:13px;font-weight:800;padding:4px 9px;border-radius:8px;margin-bottom:2px}
.p-save{margin-top:9px;display:inline-flex;gap:6px;align-items:center;background:#eafaf1;color:#0a8a4f;font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:10px}
.stock{margin-top:11px;display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:800}
.stock .d{width:8px;height:8px;border-radius:50%}
.stock.in{color:#0a8a4f}.stock.in .d{background:var(--ok)}
.stock.out{color:var(--red)}.stock.out .d{background:var(--red)}
/* rows */
.irow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow .ic{width:40px;height:40px;border-radius:12px;background:#f6f7f9;display:grid;place-items:center;flex:0 0 auto}
.irow .ic svg{width:21px;height:21px}
.irow .tt{font-size:13.5px;font-weight:700}.irow .ss{font-size:12px;color:var(--muted);margin-top:2px}
.irow .chev{color:var(--soft)}.irow .chev svg{width:20px;height:20px}
/* installments / teal nudge */
.nudge{display:flex;align-items:center;gap:12px;background:#effcfa;border:1px solid #c7efe9;border-radius:14px;padding:13px}
.nudge .ic{width:38px;height:38px;border-radius:11px;background:#d6f5ef;display:grid;place-items:center}
.nudge .ic svg{width:20px;height:20px;color:var(--teal)}
.nudge .tt{font-size:13px;font-weight:800}.nudge .ss{font-size:12px;color:var(--muted);margin-top:2px}
.nudge .ss b{color:var(--teal)}
/* brand */
.brand{display:flex;align-items:center;gap:12px}
.brand .lg{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#f6f7f9;padding:5px;flex:0 0 auto}
.brand .nm{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.brand .cap{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.vbadge{width:16px;height:16px;color:var(--blue);display:inline-flex}
.vbadge svg{width:16px;height:16px;display:block}
.brand .more{margin-inline-start:auto;font-size:12.5px;font-weight:800;color:var(--muted);background:#f2f3f5;border-radius:20px;padding:6px 12px}
/* trust strip */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:9px 11px}
.tcell{background:#fff;border-radius:14px;padding:11px 5px;text-align:center;box-shadow:var(--sh)}
.tcell svg{width:22px;height:22px;color:#14171a;margin-bottom:5px}
.tcell .tt{font-size:10.5px;font-weight:800;line-height:1.3}
/* variations */
.ccrow{display:flex;flex-wrap:wrap;gap:12px;padding:2px 0}
.colorcard{display:inline-flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;width:68px;cursor:pointer}
.cc-im{display:inline-block;width:68px;height:68px;border-radius:16px;border:2px solid var(--line);object-fit:contain;background:#fff;box-shadow:var(--sh)}
.colorcard.on .cc-im{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.cc-more{display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--muted)}
.cc-lb{font-size:11.5px;font-weight:700;color:var(--muted);max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colorcard.on .cc-lb{color:var(--ink)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:700;background:#fff}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.chip.more{border-style:dashed;color:var(--muted)}
.colorchip{display:inline-flex;align-items:center;gap:7px}
.chipimg{width:24px;height:24px;border-radius:7px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.colorchip.on .chipimg{border-color:rgba(255,255,255,.5)}
.chipdot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:0 0 auto}
.smartfit{background:linear-gradient(135deg,#7a5af8,#4f46e5);color:#fff;border-radius:11px;padding:9px 14px;font-size:12.5px;font-weight:800}
.smartfit svg{width:15px;height:15px;flex:0 0 auto}
/* rank strip */
.rank{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.rank:last-child{border-bottom:0}.rank .n{color:#e6a700;font-weight:900}
/* price history */
.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ph-cell{text-align:center;background:#f8f9fb;border-radius:12px;padding:10px 6px}
.ph-cell .v{font-size:15px;font-weight:900}.ph-cell .k{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.ph-cell.now .v{color:var(--ink)}.ph-cell.low .v{color:#0a8a4f}.ph-cell.hi .v{color:var(--red)}
.ph-low{margin-top:11px;display:flex;gap:8px;align-items:center;background:#fff4d6;color:#8a6d00;font-size:12.5px;font-weight:800;padding:9px 12px;border-radius:11px}
/* vendor */
.vendor{display:flex;align-items:center;gap:12px}
.vendor .lg{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#f6f7f9;flex:0 0 auto}
.vendor .nm{font-size:14.5px;font-weight:800}.vendor .cap{font-size:11px;color:var(--muted);font-weight:700}
.tier{display:inline-block;font-size:10px;font-weight:900;color:#fff;padding:2px 8px;border-radius:20px;margin-inline-start:6px}
.tier.platinum{background:linear-gradient(135deg,#8e9eab,#5b6b7a)}.tier.gold{background:linear-gradient(135deg,#e6b800,#b8860b)}
.tier.silver{background:linear-gradient(135deg,#b0b6bd,#868d95)}.tier.bronze{background:linear-gradient(135deg,#c08457,#9a6a45)}
.vendor .visit{margin-inline-start:auto;background:var(--y);color:var(--y-ink);font-weight:900;font-size:12.5px;padding:8px 15px;border-radius:20px}
/* expert reviews */
.expert{background:linear-gradient(135deg,#f3f7ff,#fff)}
.exp-hd{display:flex;align-items:center;gap:5px}
.exp-title{font-size:13px;font-weight:900;color:#1a1a1a}
.exp-online{display:none;align-items:center;gap:3px;font-size:9.5px;font-weight:800;color:#047857;margin-top:1px}
.exp-online:not(:empty){display:inline-flex}
.exp-online .d{width:6px;height:6px;border-radius:50%;background:#10b981}
.exp-pill{font-size:9.5px;font-weight:900;border-radius:999px;padding:5px 10px;flex:0 0 auto}
.exp-pill.y{background:#f5c320;color:#412402}.exp-pill.b{background:#1565c0;color:#fff}
.vcard{display:flex;gap:8px;padding:9px;background:#fff;border:1px solid #e3eaf6;border-radius:11px;margin-top:7px}
.v-av{position:relative;width:28px;height:28px;flex:0 0 auto}
.v-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#e3eaf6}
.v-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:#10b981;border:1.5px solid #fff}
.v-head{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.v-nm{font-size:11.5px;font-weight:800;color:#1a1a1a}
.v-ok{width:12px;height:12px;fill:#1565c0}
.v-lvl{font-size:8px;font-weight:800;color:#1565c0;background:#eff4ff;border-radius:4px;padding:1px 5px}
.v-date{font-size:8.5px;color:#6b6b6b;margin-inline-start:auto}
.v-spec{font-size:9px;color:#6b6b6b;margin-top:1px}
.v-rate{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:3px}
.v-badge{font-size:8.5px;font-weight:900;border-radius:4px;padding:1.5px 6px}
.v-mini{font-size:8.5px;font-weight:700;color:#6b6b6b}
.v-notes{font-size:10.5px;color:#3f3f3f;line-height:1.35;margin-top:3px}
.exp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:12px;border-radius:13px;background:linear-gradient(135deg,#1565c0,#3b82c4);text-align:center}
.exp-stats b{display:block;font-size:17px;font-weight:900;color:#fff}.exp-stats span{font-size:10px;color:rgba(255,255,255,.75)}
.exp-fil{font-size:10.5px;font-weight:800;border-radius:999px;padding:5px 11px;background:#fff;border:1px solid #efefef;color:#3f3f3f}
.exp-fil.on{background:#1565c0;border-color:#1565c0;color:#fff}
.stile{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #efefef;border-radius:12px;margin-bottom:8px}
.stile-ask{background:#1565c0;color:#fff;font-size:11px;font-weight:900;border-radius:9px;padding:7px 13px;flex:0 0 auto}
.sess-opt{flex:1;padding:9px 10px;border-radius:10px;border:1px solid #efefef;background:#fff;font-size:10.5px;font-weight:800;color:#1a1a1a}
.sess-opt.on{background:#eff4ff;border-color:#1565c0;border-width:1.5px;color:#1565c0}
/* bulk */
.bulk{background:linear-gradient(135deg,#fffae6,#fffdf5);border:1px solid #f2e6a8}
.tiers{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:6px}.tiers::-webkit-scrollbar{display:none}
.tier-c{flex:0 0 auto;min-width:88px;text-align:center;border:1.5px solid #f0e4a0;border-radius:13px;padding:11px 10px;background:#fff}
.tier-c.on{border-color:#e6a700;box-shadow:0 0 0 2px rgba(230,167,0,.2)}
.tier-c .q{font-size:11px;font-weight:800;color:var(--muted)}.tier-c .p{font-size:15px;font-weight:900;margin-top:3px}
.tier-c .s{font-size:10.5px;font-weight:800;color:#067a43;margin-top:2px}
.tier-c .best{font-size:9px;font-weight:900;color:#fff;background:#e6a700;border-radius:6px;padding:1px 6px;display:inline-block;margin-top:4px}
/* description */
.desc{font-size:14px;line-height:1.95;color:#374151;word-break:break-word}
.desc img{border-radius:12px;margin:10px 0}
.desc.clamp{max-height:200px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 72%,transparent)}
.more-btn{margin-top:11px;color:var(--blue);font-weight:800;font-size:13.5px}
/* specs teaser */
.teaser{display:flex;align-items:center;gap:12px}
.teaser .ic{width:40px;height:40px;border-radius:12px;background:#f6f7f9;display:grid;place-items:center}
.teaser .ic svg{width:21px;height:21px}
.teaser .tt{font-size:14px;font-weight:800}.teaser .ss{font-size:12px;color:var(--muted);margin-top:2px}
.teaser .chev{margin-inline-start:auto;color:var(--soft)}.teaser .chev svg{width:20px;height:20px}
/* reviews */
.rv-head{display:flex;gap:16px;align-items:center}
.rv-avg{text-align:center;flex:0 0 auto}
.rv-avg .big{font-size:36px;font-weight:900;line-height:1}.rv-avg .st svg{width:14px;height:14px;fill:#ffb300}
.rv-avg .ct{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.rv-bars{flex:1;display:flex;flex-direction:column;gap:5px}
.rv-bar{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-weight:700}
.rv-bar .track{flex:1;height:7px;border-radius:4px;background:#eef0f2;overflow:hidden}
.rv-bar .fill{height:100%;background:#ffb300;border-radius:4px}
.rv-card{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rv-card .top{display:flex;align-items:center;gap:9px}
.rv-card .av{width:34px;height:34px;border-radius:50%;background:#eef0f2;display:grid;place-items:center;font-weight:800;color:var(--muted);flex:0 0 auto}
.rv-card .nm{font-size:13px;font-weight:800}.rv-card .vp{font-size:10.5px;color:#0a8a4f;font-weight:800}
.rv-card .body{font-size:13.5px;line-height:1.8;color:#374151;margin-top:8px}
.rv-photos{display:flex;gap:7px;margin-top:8px}.rv-photos img{width:54px;height:54px;border-radius:10px;object-fit:cover}
.rv-empty{text-align:center;color:var(--muted);padding:18px 0}.rv-empty .em{font-size:34px}
/* related grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);overflow:hidden;transition:.15s;display:flex;flex-direction:column}
.gcard:active{transform:scale(.98)}
.gcard .gi{position:relative;aspect-ratio:1/1;background:#fafafa;overflow:hidden}
.gcard .gi img{width:100%;height:100%;object-fit:cover}
.gc-heart{position:absolute;bottom:8px;right:8px;z-index:2;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.gc-heart svg{width:13px;height:13px;fill:none;stroke:#6b6b6b;stroke-width:2}
.gc-heart.on svg{fill:#ff4d4d;stroke:#ff4d4d}
.gcard .gb{padding:4px 8px 6px;display:flex;flex-direction:column;flex:1}
.gcard .gn{font-size:11px;font-weight:700;line-height:1.25;height:28px;overflow:hidden;color:#1a1a1a}
.gc-promo{border-radius:999px;padding:1px 5px;font-size:8px;font-weight:900;white-space:nowrap}
.gc-price{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin-top:2px;min-height:16px}
.gc-now{font-size:13.5px;font-weight:900;color:#1a1a1a;letter-spacing:-.3px}
.gc-cur{font-size:9px;font-weight:700;color:#6b6b6b}
.gc-was{font-size:9px;color:rgba(0,0,0,.55);font-weight:700;text-decoration:line-through;text-decoration-color:#ff4d4d;text-decoration-thickness:1.5px;margin-inline-start:2px}
.gc-off{background:#d92d2d;color:#fff;font-size:8.5px;font-weight:900;border-radius:3px;padding:1px 4px;margin-inline-start:2px}
.gc-rate{display:flex;align-items:center;gap:2px;height:14px;margin-top:2px}
.gc-star{width:11px;height:11px;fill:#cfcfcf}.gc-star.f{fill:#ffc107}
.gc-cnt{font-size:9px;color:#6b6b6b;font-weight:600;margin-inline-start:2px}
.gc-trend{font-size:9px;font-weight:800;margin-inline-start:4px}.gc-trend.d{color:#047857}.gc-trend.u{color:#ff4d4d}.gc-trend.s{color:#1565c0}
.gc-tick{height:14px;font-size:9.5px;font-weight:500;color:#3f3f3f;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .18s}
.gc-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;min-height:17px}
.gc-b{font-size:8px;font-weight:900;border-radius:4px;padding:2px 6px;letter-spacing:.3px;white-space:nowrap}
.gc-b.avail{background:#ecfdf5;color:#047857}.gc-b.out{background:#ffe3e3;color:#b91c1c}
.gc-b.lowest{background:#fff3e0;color:#bf360c;border-radius:999px}.gc-b.sale{background:#ffebee;color:#c62828;border-radius:999px}.gc-b.new{background:#e3f2fd;color:#1565c0;border-radius:999px}
.loadmore{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 22px);margin:14px 11px 0;text-align:center;
  background:linear-gradient(180deg,#fff,#fafbfc);border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:800;font-size:13.5px;box-shadow:var(--sh);color:var(--ink);transition:.15s}
.loadmore:active{transform:translateY(1px);background:#f4f5f7}
.loadmore svg{stroke:var(--muted)}
.loadmore.gone{display:none}
/* ===== section tabs ===== */
.tabs{position:fixed;top:calc(var(--safe-t) + 51px);left:0;right:0;z-index:43;max-width:540px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  box-shadow:0 4px 12px rgba(16,24,40,.06);display:flex;height:44px;transform:translateY(-14px);opacity:0;pointer-events:none;transition:.26s}
.tabs.show{pointer-events:auto}
.tabs.show{transform:none;opacity:1}
.tab{flex:1;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);position:relative}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';position:absolute;bottom:0;left:18%;right:18%;height:2.5px;background:var(--y);border-radius:2px}

.cta{position:fixed;bottom:0;left:0;right:0;z-index:50;max-width:540px;margin:0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(16,24,40,.06);padding-bottom:var(--safe-b)}
.lamma-bar{display:none;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fff8e6}
.lamma-bar.show{display:flex}
.lamma-bar .thumbs{display:flex}.lamma-bar .thumbs img{width:30px;height:30px;border-radius:8px;border:2px solid #fff;object-fit:cover;margin-inline-start:-8px}
.lamma-bar .px{font-size:13px;font-weight:900}.lamma-bar .was{font-size:11px;color:var(--red);text-decoration:line-through;font-weight:700}
.lamma-bar .go{margin-inline-start:auto;background:#ff7a00;color:#fff;font-weight:900;font-size:12.5px;padding:8px 14px;border-radius:12px}
.cta-row{display:flex;align-items:center;gap:9px;padding:10px 12px}
.beena{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#ffd400,#ff9a00);display:grid;place-items:center;flex:0 0 auto;position:relative;box-shadow:0 3px 12px rgba(255,154,0,.4)}
.beena svg{width:26px;height:26px}
.beena .qp{position:absolute;top:-9px;left:-6px;background:#c92a2f;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;white-space:nowrap}
.cta-add{flex:2;height:52px;border-radius:15px;background:linear-gradient(135deg,#ffd400,#ffc400);color:var(--y-ink);font-size:15px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(255,196,0,.42)}
.cta-add svg{width:21px;height:21px}
.cta-buy{flex:1;height:52px;border-radius:15px;background:linear-gradient(135deg,#ff4d4f,#e5484d);color:#fff;font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(229,72,77,.4)}
.cta-buy svg{width:19px;height:19px;fill:#fff}
.cta-buy.lamma{background:linear-gradient(135deg,#ff9a00,#ff7a00);box-shadow:0 4px 14px rgba(255,122,0,.4)}
.cta-buy.lamma svg{fill:none;stroke:#fff}
.cta-add:active,.cta-buy:active{transform:translateY(1px)}
.cta-notify{margin:10px 12px;height:54px;border-radius:15px;background:linear-gradient(135deg,#5a4632,#3d2f22);color:#fff;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
/* ===== sheet ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(16,20,26,.5);z-index:70;opacity:0;pointer-events:none;transition:.22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:540px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;
  max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.9,.4,1);padding-bottom:calc(16px + var(--safe-b))}
.sheet.on{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#dfe2e6;margin:12px auto 6px}
.sheet .hd{padding:6px 52px 14px 18px;font-size:17px;font-weight:900;position:sticky;top:0;background:#fff;z-index:2}
.sheet-x{position:absolute;top:12px;left:14px;z-index:5;width:34px;height:34px;border-radius:50%;background:#f2f3f5;display:grid;place-items:center}
.sheet-x svg{width:20px;height:20px;stroke:#14171a}
.lam-rm{width:30px;height:30px;border-radius:50%;background:#f2f3f5;color:var(--muted);font-size:14px;font-weight:700;flex:0 0 auto}
.lam-rm:active{background:#ffe9ea;color:var(--red)}
.sheet .bd{padding:0 16px}
/* qty stepper */
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;font-size:22px;font-weight:700;display:grid;place-items:center}
.stepper .q{min-width:44px;text-align:center;font-weight:900;font-size:16px}
.confirm{margin-top:16px;width:100%;height:54px;border-radius:15px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.confirm.add{background:linear-gradient(135deg,#ffd400,#ffc400);color:var(--y-ink)}
.confirm.buy{background:linear-gradient(135deg,#ff4d4f,#e5484d);color:#fff}
.confirm svg{width:20px;height:20px;flex:0 0 auto}
.confirm.buy svg{fill:#fff;stroke:none}
/* delivery cards (in options sheet) */
.dlv-free{font-size:11px;font-weight:800;color:#0a8a4f}
.dlv-card{border:1.5px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;background:#fff}
.dlv-card.now{background:#f2fbf5;border-color:rgba(18,183,106,.4)}
.dlv-top{display:flex;align-items:center;gap:7px}
.dlv-top svg{width:16px;height:16px;flex:0 0 auto}
.dlv-card.now .dlv-top svg{color:var(--ok);fill:var(--ok);stroke:var(--ok)}
.dlv-card:not(.now) .dlv-top svg{color:var(--muted);stroke:var(--muted)}
.dlv-nm{flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlv-pill{font-size:9.5px;font-weight:900;padding:3px 9px;border-radius:999px}
.dlv-pill.now{background:rgba(18,183,106,.15);color:#0a8a4f}
.dlv-pill.later{background:#f1f5f9;color:var(--muted)}
.dlv-txt{font-size:11.5px;color:#374151;line-height:1.45;margin-top:5px}
.dlv-bits{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.dlv-bits span{font-size:10px;font-weight:700;color:var(--muted)}
/* installments sheet */
.inst-hd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.inst-ic{width:42px;height:42px;border-radius:12px;background:#f1fbf7;display:grid;place-items:center;flex:0 0 auto}
.inst-ic svg{width:22px;height:22px;color:#0e8a6a}
.inst-t{font-size:16.5px;font-weight:900}.inst-s{font-size:12px;color:#7a8a85;margin-top:2px}
.timeline{margin:18px 0 6px}
.tl-row{display:flex;align-items:center;gap:12px;position:relative;padding-bottom:16px}
.tl-row::before{content:'';position:absolute;top:26px;bottom:0;right:12px;width:2px;background:#e6f4ee}
.tl-row.last{padding-bottom:0}.tl-row.last::before{display:none}
.tl-dot{width:26px;height:26px;border-radius:50%;background:#0e8a6a;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;flex:0 0 auto;z-index:1}
.tl-mid{flex:1}.tl-p{font-size:13px;font-weight:800}.tl-w{font-size:11px;color:var(--muted);margin-top:1px}
.tl-a{font-size:14px;font-weight:900}
.inst-total{display:flex;justify-content:space-between;align-items:center;background:#f6f6f6;border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;color:#555}
.inst-total b{font-size:15px;color:var(--ink)}
.inst-how{font-size:13.5px;font-weight:900;margin:16px 0 8px}
.inst-step{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#374151;line-height:1.6;margin-bottom:7px}
.inst-step .n{width:20px;height:20px;border-radius:50%;background:#eef7f3;color:#0e8a6a;font-size:11px;font-weight:900;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.inst-prov{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:11.5px;color:#8a8a8a}
.pchip{background:#f2f3f5;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--ink)}
.pchip.soon{color:var(--muted);font-weight:700}
/* toast */
.toast{position:fixed;bottom:calc(150px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:#14171a;color:#fff;
  font-size:13.5px;font-weight:800;padding:12px 22px;border-radius:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}
/* defer placeholder */
.defer{min-height:90px}

    res.innerHTML='<div class="sr-hint">'+(AR?'جارٍ البحث…':'Searching…')+'</div>';

function gallery(){
  var vids=(P.videos||[]);var imgs=(P.images&&P.images.length?P.images:[P.image]).filter(Boolean);

  var items=[];vids.forEach(function(v){items.push({vid:v,thumb:v.thumbnail||v.thumb||v.image||imgs[0]})});
  imgs.forEach(function(u,i){items.push({img:u,idx:i})});

  var g=el('div','gal');

  if(vids.length)g.appendChild(el('div','gal-vpill',IC.play+' '+(AR?(vids.length+' فيديو'):(vids.length+' videos'))));
  var track=el('div','gal-track');var slides=[];
  items.forEach(function(it){var s=el('div','gal-slide'+(it.vid?' vid':''));var im=el('img');im.loading=(it.idx===0?'eager':'lazy');im.src=(it.vid?(it.thumb||''):it.img);if(im.src)im.src=im.src.replace('/image_1920','/image_1024');im.alt=txt(P.name);s.appendChild(im);

    slides.push(s);track.appendChild(s)});

  if(items.length>1){
    g.appendChild(el('div','gal-count','<span id="galIdx">1</span> / '+items.length));
    var prev=el('button','gal-nav prev',IC.chev);var next=el('button','gal-nav next',IC.chev);prev.setAttribute('aria-label',AR?'الصورة السابقة':'Previous image');next.setAttribute('aria-label',AR?'الصورة التالية':'Next image');
    function go(d){var idx=Math.round(Math.abs(track.scrollLeft)/track.clientWidth);idx=Math.min(items.length-1,Math.max(0,idx+d));slides[idx].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
    prev.onclick=function(e){e.stopPropagation();go(1)};next.onclick=function(e){e.stopPropagation();go(-1)}; // RTL: prev(right)=forward visually
    g.appendChild(prev);g.appendChild(next);
    var dots=el('div','gal-dots');items.forEach(function(_,i){var dd=el('span','gal-dot'+(i?'':' on'));dd.onclick=function(){slides[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})};dots.appendChild(dd)});g.appendChild(dots);
    track.addEventListener('scroll',function(){var idx=Math.round(Math.abs(track.scrollLeft)/track.clientWidth);idx=Math.min(items.length-1,idx);
      var gi=$('#galIdx');if(gi)gi.textContent=idx+1;$$('.gal-dot',dots).forEach(function(d,j){d.classList.toggle('on',j===idx)})},{passive:true});
  }

function openLightbox(start){
  if(!GAL_IMGS.length)return;
  var lb=el('div','lb');
  var x=el('button','lb-x',IC.x);x.onclick=function(){lb.remove()};
  var track=el('div','lb-track');var slides=[];
  GAL_IMGS.forEach(function(u){var s=el('div','lb-slide');var im=el('img');im.src=u;s.appendChild(im);slides.push(s);track.appendChild(s)});
  var count=el('div','lb-count','<span id="lbIdx">'+(start+1)+'</span> / '+GAL_IMGS.length);
  lb.appendChild(x);lb.appendChild(track);lb.appendChild(count);document.body.appendChild(lb);
  if(slides[start])slides[start].scrollIntoView({inline:'center',block:'nearest'});
  track.addEventListener('scroll',function(){var idx=Math.round(Math.abs(track.scrollLeft)/track.clientWidth);idx=Math.min(GAL_IMGS.length-1,idx);var e=$('#lbIdx');if(e)e.textContent=idx+1},{passive:true});
  lb.addEventListener('click',function(e){if(e.target===lb)lb.remove()});
}
function playVideo(v){
  var url=(v.url||v.src||v.link||v.embed_url||v.video_url||v.youtube||'').toString();
  var embed='';
  var ym=url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{6,})/);
  if(ym)embed='https://www.youtube.com/embed/'+ym[1]+'?autoplay=1&playsinline=1';
  var vm=url.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(!embed&&vm)embed='https://player.vimeo.com/video/'+vm[1]+'?autoplay=1';
  var mp4=/\.mp4($|\?)/i.test(url);
  var inner;
  if(embed)inner='<iframe src="'+esc(embed)+'" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>';
  else if(mp4)inner='<video src="'+esc(url)+'" controls autoplay playsinline></video>';
  else{if(url)window.open(url,'_blank');return}
  var lb=el('div','lb');var x=el('button','lb-x',IC.x);x.onclick=function(){lb.remove()};
  var box=el('div','lb-video',inner);lb.appendChild(x);lb.appendChild(box);document.body.appendChild(lb);
  lb.addEventListener('click',function(e){if(e.target===lb)lb.remove()});
}

    if(want.every(function(vid){return va.some(function(a){return a.value_id===vid})}))return VARIANTS[i]}
  return null;
}

function drawSpark(cv,vals,mn,mx){var ctx=cv.getContext('2d'),w=cv.width,h=cv.height,pad=8;mn=Math.min.apply(null,vals);mx=Math.max.apply(null,vals);var rng=(mx-mn)||1;
  function X(i){return pad+(w-2*pad)*(i/(vals.length-1))}function Y(v){return h-pad-(h-2*pad)*((v-mn)/rng)}
  var grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'rgba(255,196,0,.28)');grad.addColorStop(1,'rgba(255,196,0,0)');
  ctx.beginPath();ctx.moveTo(X(0),Y(vals[0]));for(var i=1;i<vals.length;i++)ctx.lineTo(X(i),Y(vals[i]));ctx.lineTo(X(vals.length-1),h-pad);ctx.lineTo(X(0),h-pad);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(X(0),Y(vals[0]));for(var j=1;j<vals.length;j++)ctx.lineTo(X(j),Y(vals[j]));ctx.strokeStyle='#e6a700';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  ctx.beginPath();ctx.arc(X(vals.length-1),Y(vals[vals.length-1]),4,0,7);ctx.fillStyle='#e6a700';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}

  });
  var sum=el('div');sum.style.cssText='margin-top:14px;padding:14px;background:#fff8e6;border:1px solid #f2e6a8;border-radius:14px';
  sum.innerHTML=((LAMMA.saved>0)?'<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)"><span>'+(AR?'قبل اللمّة':'Before')+'</span><s>'+money(LAMMA.subtotal)+' '+CUR+'</s></div><div style="display:flex;justify-content:space-between;font-size:13px;color:#0a8a4f;font-weight:800;margin-top:4px"><span>'+(AR?'وفّرت':'You save')+'</span><span>'+money(LAMMA.saved)+' '+CUR+'</span></div>':'')+
    '<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin-top:8px"><span>'+(AR?'تدفع':'You pay')+'</span><span>'+money(LAMMA.pays)+' '+CUR+'</span></div>'+
    (LAMMA.monthly>0?'<div style="font-size:11.5px;color:var(--muted);margin-top:4px">'+(AR?'أو قسّطها ':'or ')+money(LAMMA.monthly)+' '+CUR+(AR?' / شهر':'/mo')+'</div>':'');
  b.appendChild(sum);
  var ready=LAMMA.n>=LAMMA.min_items;var need=LAMMA.min_items-LAMMA.n;
  var btn=el('button','confirm add',ready?('🧺 '+(AR?'إتمام اللمّة':'Checkout Lamma')):(AR?('أضِف '+need+' منتج لبدء اللمّة'):('Add '+need+' more to start')));
  btn.style.marginTop='14px';if(!ready){btn.style.background='#f0f0f0';btn.style.color='#999'}
  btn.onclick=function(){if(ready){lammaCall('/lamma/checkout').then(function(r){location.assign((r&&(r.redirect||r.url))||'/shop/cart')})}else{closeSheet()}};
  b.appendChild(btn);
  openSheet('🧺 '+(txt(LAMMA.label)||'لمّة يلو'),b);
}
function addToLamma(pid){var b=$('#lammaBtn');if(b)b.style.opacity=.6;lammaCall('/lamma/add',{product_id:pid}).then(function(r){if(b)b.style.opacity=1;if(r){LAMMA=r;renderLammaBar();toast((r.n>=r.min_items)?(AR?'لمّتك جاهزة! 🧺':'Lamma ready!'):(AR?'أُضيف إلى لمّتك 🧺 · أضِف منتجًا آخر':'Added to Lamma'))}else toast(AR?'تعذّرت الإضافة للمّة':'Failed')})}

/* ===================== BOTTOM CTA ===================== */
var QTY=1;
function ctaBar(){
  var cta=$('#cta');cta.innerHTML='';
  var lb=el('div','lamma-bar');lb.id='lammaBar';cta.appendChild(lb); // hidden until lamma seeded
  if(!P._inStock){var nb=el('button','cta-notify','🔔 '+(AR?'أعلمني عند التوفّر':'Notify me when back'));nb.onclick=function(){toast(AR?'سنعلمك عند توفّره':'We will notify you')};cta.appendChild(nb);return}
  var row=el('div','cta-row');
  var beena=el('button','beena',IC.bee+'<span class="qp">'+(AR?'مساعدة؟':'Help?')+'</span>');beena.onclick=openBeena;row.appendChild(beena);
  var add=el('button','cta-add',IC.cart+' '+(AR?'أضف للسلة':'Add to cart'));add.onclick=function(){buySheet(false)};row.appendChild(add);
  var buy=el('button','cta-buy lamma',IC.bag+' '+(AR?'لمّة':'Lamma'));buy.id='lammaBtn';buy.onclick=function(){addToLamma(PID)};row.appendChild(buy);
  cta.appendChild(row);
}

/* BUY SHEET */
function buySheet(isBuy){
  var was=P.compare_price&&P.compare_price.amount;var off=P.discount_pct||0;var maxq=P.max_qty_buyable||99;var qt=QTY;
  function curPrice(){var v=resolveVariant();return (v&&v.price&&v.price.amount!=null)?v.price.amount:((P.price&&P.price.amount)||0)}
  var b=el('div');
  var imgEl=el('img');imgEl.style.cssText='width:100%;aspect-ratio:16/10;object-fit:contain;background:#f6f7f9;border-radius:14px';imgEl.alt=txt(P.name)||'';imgEl.loading='lazy';
  imgEl.src=(function(){for(var k in VARSTATE){if(VARSTATE[k]&&VARSTATE[k].image)return VARSTATE[k].image}return (P.images&&P.images[0])||P.image})();
  b.appendChild(imgEl);
  b.appendChild(el('div',null,'<div style="font-weight:800;font-size:15px;line-height:1.5;margin:12px 0 8px">'+esc(txt(P.name))+'</div>'));
  var pbox=el('div','pricebox');b.appendChild(pbox);
  function drawPrice(){var price=curPrice();pbox.innerHTML='<span class="p-now" style="font-size:24px">'+money(price)+'</span> <span class="p-cur">'+CUR+'</span>'+(was&&was>price?' <s class="p-was">'+money(was)+' '+CUR+'</s> <span class="p-off">-'+off+'%</span>':'')}
  function upSub(){sub.innerHTML='<span>'+(AR?'الإجمالي':'Subtotal')+'</span><span>'+money(curPrice()*qt)+' '+CUR+'</span>'}
  drawPrice();
  // variation pickers (colors / sizes)
  var attrs=(P.attributes||[]).filter(function(a){return !/brand|علامة/i.test(txt(a.attribute_name||a.name))&&(a.values||[]).length>1}).slice(0,2);
  attrs.forEach(function(a){
    var vals=a.values||[];var aname=txt(a.attribute_name||a.name);var isColor=/image/i.test(a.display_type||'')||/لون|color/i.test(aname);
    b.appendChild(el('div',null,'<div style="font-size:13px;font-weight:800;margin:14px 0 8px">'+esc(aname)+'</div>'));
    var wrap=el('div',isColor?'ccrow':'chiprow');vals.forEach(function(v){var on=VARSTATE[a.attribute_id]&&VARSTATE[a.attribute_id].id===v.id;
      var ch;
      if(isColor){ch=el('button','colorcard'+(on?' on':''));ch.innerHTML=(v.image?'<img class="cc-im" alt="'+esc(txt(v.name||v.label||v)||'')+'" src="'+esc((v.image||'').replace('/image_512','/image_128'))+'">':'<span class="cc-im" style="background:'+(v.html_color||'#eee')+'"></span>')+'<span class="cc-lb">'+esc(txt(v.name))+'</span>';}
      else{ch=el('button','chip'+(on?' on':''),esc(txt(v.name)));}
      ch.onclick=function(){$$('.'+(isColor?'colorcard':'chip'),wrap).forEach(function(x){x.classList.remove('on')});ch.classList.add('on');VARSTATE[a.attribute_id]=v;if(v.image)imgEl.src=v.image;drawPrice();upSub();applyVariant()};wrap.appendChild(ch)});b.appendChild(wrap);
  });
  // qty
  var qrow=el('div');qrow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:16px';
  qrow.appendChild(el('div',null,'<div style="font-weight:800;font-size:14px">'+(AR?'الكمية':'Quantity')+'</div>'));
  var st=el('div','stepper');var minus=el('button',null,'−'),q=el('span','q',qt),plus=el('button',null,'+');
  minus.onclick=function(){if(qt>1){qt--;q.textContent=qt;upSub()}};plus.onclick=function(){if(qt<maxq){qt++;q.textContent=qt;upSub()}};
  st.appendChild(minus);st.appendChild(q);st.appendChild(plus);qrow.appendChild(st);b.appendChild(qrow);
  var sub=el('div');sub.style.cssText='display:flex;justify-content:space-between;margin-top:16px;font-weight:900;font-size:16px';b.appendChild(sub);upSub();
  var btn=el('button','confirm '+(isBuy?'buy':'add'),(isBuy?IC.bolt+' '+(AR?'شراء الآن':'Buy now'):IC.cart+' '+(AR?'أضف للسلة':'Add to cart')));
  btn.onclick=function(){btn.style.opacity=.6;addToCart(cartProductId(),qt,function(ok){btn.style.opacity=1;closeSheet();if(ok){if(isBuy)location.assign('/shop/cart');else toast(AR?'تمت الإضافة إلى السلة ✓':'Added ✓')}else toast(AR?'تعذّرت الإضافة':'Failed')})};
  b.appendChild(btn);
  openSheet(AR?(isBuy?'شراء الآن':'أضف للسلة'):'',b);
}

/* ===================== BEENA ===================== */
function openBeena(){
  var b=el('div');
  b.appendChild(el('div',null,'<div style="text-align:center;padding:4px 0 12px"><div style="width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,#ffd400,#ff9a00);display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 6px 18px rgba(255,154,0,.35)">'+IC.bee.replace('viewBox','width="34" height="34" viewBox')+'</div><div style="font-size:18px;font-weight:900">'+(AR?'أهلاً! أنا بينا 🐝':'Hi! I am Beena')+'</div><div style="font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6">'+(AR?'مساعدتك الذكية في يلو. اختر ما يهمّك حول هذا المنتج:':'Your smart assistant. How can I help with this product?')+'</div></div>'));
  var acts=[
    [IC.star,(AR?'هل هذا المنتج مناسب لي؟':'Is this right for me?'),function(){toast(AR?'بينا تحلّل المنتج… ستصلك توصية':'Beena is analyzing…')}],
    [IC.truck,(AR?'متى يصلني الطلب؟':'When will it arrive?'),function(){closeSheet();var d=$('#dlvS');if(d)d.scrollIntoView({behavior:'smooth',block:'center'})}],
    [IC.spark,(AR?'اعرض لي بدائل أرخص':'Show cheaper alternatives'),function(){closeSheet();if(KEYS.fy)KEYS.fy.scrollIntoView({behavior:'smooth',block:'start'})}],
    [IC.card,(AR?'كيف أقسّط هذا المنتج؟':'How to pay in installments?'),function(){toast(AR?'التقسيط متاح عند إتمام الطلب':'Available at checkout')}]
  ];
  acts.forEach(function(a){var r=el('button','irow');r.style.cssText='width:100%;text-align:start';r.innerHTML='<div class="ic">'+a[0]+'</div><div style="flex:1"><div class="tt">'+esc(a[1])+'</div></div><div class="chev">'+IC.chev+'</div>';r.onclick=a[2];b.appendChild(r)});
  openSheet(AR?'بينا · مساعدتك الذكية':'Beena · Assistant',b);
}

/* ===================== SECTION TABS ===================== */
function setupTabs(){
  var tabs=$('#tabs');var order=['ov','dt','rv','fy'];
  $$('.tab',tabs).forEach(function(t){t.onclick=function(){var k=t.dataset.k;if(KEYS[k])KEYS[k].scrollIntoView({behavior:'smooth',block:'start'})}});
  var last='ov';
  window.addEventListener('scroll',function(){
    var y=window.scrollY||window.pageYOffset;
    tabs.classList.toggle('show',y>340);
    var cur='ov';order.forEach(function(k){var n=KEYS[k];if(n&&n.getBoundingClientRect().top<=140)cur=k});
    if(cur!==last){last=cur;$$('.tab',tabs).forEach(function(t){t.classList.toggle('on',t.dataset.k===cur)})}
  },{passive:true});
}

boot();
})();
</script>
