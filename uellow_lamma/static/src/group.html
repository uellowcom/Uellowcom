<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,follow">
<title>لمّة جماعية · شارك لمّتك 🧺</title>
<style>
:root{--y:#F5C320;--y2:#E0A72E;--brown:#412402;--ink:#151515;--muted:#6B6B6B;--line:#ECECEC;
 --bg:#F4F2EE;--o1:#FF7A1A;--o2:#FF9E45;--g:#0E9F6E;--gd:#047857;--gbg:#E7FBF2;
 --sans:'SF Arabic','Segoe UI',system-ui,-apple-system,'Noto Kufi Arabic','Tahoma',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px}
.tnum{font-variant-numeric:tabular-nums}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;z-index:20;
 background:rgba(244,242,238,.92);backdrop-filter:blur(10px)}
.hd .bk{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;text-decoration:none;color:var(--ink)}
.hd .ttl{font-weight:900;font-size:17px;flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-weight:800;padding:5px 11px;font-size:11.5px}
.save{background:var(--gbg);color:var(--gd)}
.avat{border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pad{padding:0 16px}
.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:15px;font-weight:900;font-size:15px;padding:15px;border:0;width:100%;cursor:pointer;font-family:inherit}
.pri{background:linear-gradient(135deg,var(--y),var(--y2));color:var(--brown);box-shadow:0 10px 22px -8px rgba(224,167,46,.6)}
.lam{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;box-shadow:0 10px 22px -8px rgba(255,122,26,.55)}
.dark{background:var(--brown);color:var(--y)}
.ghost{background:#fff;color:var(--ink);border:1.6px solid #E7E7E7}
.wa{background:#25D366;color:#fff}
.prog{height:12px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.prog.lite{background:#EAEAEA}
.prog>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--o1),var(--o2));transition:width .5s}
.mrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #F0F0F0}
.mrow:last-child{border-bottom:0}
.thumb{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#eee}
.inp{width:100%;border:1.6px solid #E7E7E7;border-radius:13px;padding:13px;font-size:15px;font-family:inherit;text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:rgba(255,255,255,.97);
 backdrop-filter:blur(10px);border-top:1px solid #EEE;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:9px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#151515;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;z-index:50;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.center{text-align:center}
.muted{color:var(--muted);font-size:12.5px}
.big{font-weight:900;letter-spacing:-.4px}
.spin{width:26px;height:26px;border:3px solid #eee;border-top-color:var(--o1);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.pop{animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="appbar" style="position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#F5C320,#F4A100);display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 2px 10px rgba(190,130,0,.25)"><span style="font-size:20px">🧺</span><div style="flex:1;font-size:12.5px;font-weight:800;color:#3A2711;line-height:1.4">لمّة جماعية — الأفضل فتحها في تطبيق يلو</div><button onclick="openInApp()" style="background:#3A2711;color:#F5C320;border:0;border-radius:11px;padding:9px 16px;font-weight:900;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap">افتح التطبيق</button></div>
<div class="wrap" id="app"><div class="spin"></div></div>
<div class="toast" id="toast"></div>
<script>
var CODE="__CODE__";
var APP_URL="uellow://lamma/g/"+CODE;
var IOS_URL="https://apps.apple.com/app/id6769010765";
var AND_URL="https://play.google.com/store/apps/details?id=com.uellow.app";
function openInApp(){try{window.location.href=APP_URL;}catch(e){}}
(function(){try{if(!sessionStorage.getItem("ul_h")){sessionStorage.setItem("ul_h","1");setTimeout(openInApp,400);}}catch(e){}})();
var AV=["#FF7A1A","#3B82F6","#8B5CF6","#0E9F6E","#E0A72E","#EF4444","#14B8A6","#F59E0B"];
var $=function(s){return document.getElementById(s)};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("show")},2200)}
function call(path,params){return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({jsonrpc:"2.0",method:"call",params:params||{}})}).then(function(r){return r.json()}).then(function(j){return j.result||{}})}
function money(v){return (v==null?0:v).toFixed(3)}
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}

function load(){return call("/lamma/group/state",{code:CODE}).then(render)}

function render(d){
  if(!d||d.error){$("app").innerHTML='<div class="pad center" style="padding-top:80px"><div style="font-size:44px">🧺</div><h2>لمّة غير موجودة</h2><p class="muted">انتهت أو الرابط غير صحيح.</p><a class="btn pri" href="/shop" style="margin-top:16px">تصفّح المتجر</a></div>';return}
  window.__D__=d;
  var isMember=!!d.me, cur="د.ك";
  var head='<div class="hd"><a class="bk" href="/shop">‹</a><div class="ttl">'+esc(d.name||"لمّة جماعية")+' 🧺</div>'
    +'<span class="chip save">👥 '+d.member_count+'</span></div>';

  // ---- NOT a member yet: JOIN hero ----
  if(!isMember && d.state==="open"){
    var mavs=d.members.slice(0,4).map(function(m,i){return '<div class="avat" style="width:42px;height:42px;background:'+AV[i%AV.length]+';font-size:15px;margin-right:'+(i?-12:0)+'px">'+esc(m.initial)+'</div>'}).join("");
    $("app").innerHTML=head
     +'<div style="background:linear-gradient(150deg,var(--o1),var(--o2));color:#fff;padding:30px 18px 22px;text-align:center;border-radius:0 0 26px 26px" class="pop">'
     +'<div style="font-size:38px">🧺</div><div class="big" style="font-size:21px;margin-top:4px">'+esc(d.host)+' يدعوك للمّته</div>'
     +'<div style="opacity:.92;font-size:13.5px;margin-top:5px">انضم وأضِف منتجاتك — كل ما زدتم وفّرتم أكثر</div>'
     +'<div style="display:flex;justify-content:center;margin-top:14px">'+mavs+'</div>'
     +'<div style="font-size:12.5px;opacity:.92;margin-top:10px">'+d.member_count+' مشاركين · <b>وفّروا حتى الآن '+money(d.saved)+' '+cur+'</b></div></div>'
     +'<div class="pad" style="margin-top:16px"><div class="card" style="background:var(--gbg);border:1px solid #C7F0DD">'
     + progressHtml(d,true)
     +'</div><input class="inp" id="jname" placeholder="اسمك (اختياري)"></div>'
     +'<div class="bar"><button class="btn lam" onclick="doJoin()">🛍️ انضم للّمة</button></div>';
    return;
  }
  if(!isMember && d.state!=="open"){
    $("app").innerHTML=head+'<div class="pad center" style="padding-top:60px"><div style="font-size:40px">🔒</div><h3>هذه اللمّة '+(d.state==="done"?"اكتملت":"مقفلة")+'</h3><a class="btn pri" href="/shop" style="margin-top:14px">ابدأ لمّتك</a></div>';
    return;
  }

  // ---- MEMBER: live view ----
  var body=head;
  // progress hero (dark)
  body+='<div class="pad"><div style="background:linear-gradient(135deg,#151515,#2a2115);color:#fff;border-radius:20px;padding:16px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;font-size:12.5px;color:#FFD98A">تدفعون معًا</span>'
    +'<span class="chip" style="background:rgba(14,159,110,.2);color:#4ADE9B">وفّرتم '+money(d.saved)+' '+cur+' 💚</span></div>'
    +'<div style="display:flex;align-items:flex-end;gap:8px;margin-top:6px"><span class="big tnum" style="font-size:27px">'+money(d.pays)+'</span><span style="font-size:13px;color:#B9C2CF;margin-bottom:4px">'+cur+'</span>'
    +(d.saved>0?'<s class="tnum" style="color:#8A8577;font-size:13px;margin-bottom:5px">'+money(d.subtotal)+'</s>':'')+'</div>'
    +progressHtml(d,false)+'</div>';

  // my share
  if(d.me){body+='<div class="card" style="display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFF6DA,#fff);border:1px solid #F1E3AE">'
    +'<div class="avat" style="width:40px;height:40px;background:'+AV[0]+';font-size:15px">'+esc((d.me.name||"ض")[0])+'</div>'
    +'<div style="flex:1"><div style="font-weight:900;font-size:14px">نصيبك ('+d.me.n+' منتج)</div><div class="muted">'+(d.me.paid?"✔ دفعت":"تدفع نصيبك فقط")+'</div></div>'
    +'<div class="big tnum" style="font-size:19px">'+money(d.me.pays)+'</div></div>';}

  // members + contributions
  body+='<div class="pad"><div style="font-weight:900;font-size:14px;margin:2px 2px 8px">من أضاف ماذا</div><div class="card" style="padding:2px 15px">';
  d.members.forEach(function(m,i){
    var th=m.items.slice(0,3).map(function(it,k){return '<img class="thumb" src="'+esc(it.image)+'" style="margin-right:'+(k?-8:0)+'px" onerror="this.style.background=\'#e3e3e3\';this.removeAttribute(\'src\')">'}).join("");
    body+='<div class="mrow"><div class="avat" style="width:34px;height:34px;background:'+AV[i%AV.length]+';font-size:13px">'+esc(m.initial)+'</div>'
      +'<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:13px">'+esc(m.name)+(m.is_host?' <span style="color:var(--o1);font-size:11px">· المضيف</span>':'')+(m.is_me?' <span style="color:var(--g);font-size:11px">· أنت</span>':'')+'</div>'
      +'<div class="muted">'+(m.n?m.n+' منتج · '+money(m.pays)+' '+cur:'لم يضف بعد')+(m.paid?' · <span style="color:var(--g)">دفع ✔</span>':'')+'</div></div>'
      +'<div style="display:flex">'+th+'</div></div>';
  });
  body+='</div></div>';

  // share (host, open)
  if(d.me&&d.me.is_host&&d.state==="open"){
    body+='<div class="pad"><div class="card"><div style="font-weight:900;font-size:13px;margin-bottom:4px">ادعُ ناسك 🔗</div>'
     +'<div class="center" style="margin:10px 0"><div class="muted">رمز اللمّة</div><div class="big tnum" style="font-size:26px;letter-spacing:4px">'+esc(d.code)+'</div></div>'
     +'<div style="display:flex;gap:9px"><button class="btn wa" style="font-size:13px;padding:12px" onclick="shareWA()">💬 واتساب</button>'
     +'<button class="btn ghost" style="font-size:13px;padding:12px" onclick="copyLink()">🔗 نسخ الرابط</button></div></div></div>';
  }

  // action bar
  var bar='<div class="bar">';
  if(d.state==="open"){
    bar+='<button class="btn lam" style="flex:2" onclick="addMine()">➕ أضِف منتجاتي</button>';
    if(d.me&&d.me.is_host) bar+='<button class="btn dark" style="flex:1.2" onclick="doLock()">إتمام</button>';
    else if(d.me&&d.me.n>0) bar+='<button class="btn dark" style="flex:1.2" onclick="doPay()">ادفع نصيبي</button>';
  } else if(d.state==="locked"){
    if(d.me&&d.me.paid) bar+='<button class="btn ghost" disabled>✔ دفعت نصيبك</button>';
    else bar+='<button class="btn pri" onclick="doPay()">ادفع نصيبي · '+money(d.me?d.me.pays:0)+' '+cur+'</button>';
  } else {
    bar+='<a class="btn pri" href="/shop">ابدأ لمّة جديدة 🧺</a>';
  }
  bar+='</div>';
  $("app").innerHTML=body+bar;
}

function progressHtml(d,lite){
  var pct, label;
  if(d.next_tier){ // progress toward next count tier
    var span=d.next_tier.at; pct=Math.min(100,Math.round(d.n/span*100));
    label='باقي '+d.next_tier.need+' '+(d.next_tier.need==1?"منتج":"منتجات")+' لخصم <b>'+d.next_tier.pct+'٪</b>'
      +(d.free_shipping_items&&d.next_tier.at>=d.free_shipping_items?' + شحن مجاني 🚚':'');
  } else if(d.free_shipping_items && d.n<d.free_shipping_items){
    pct=Math.round(d.n/d.free_shipping_items*100); label='باقي '+(d.free_shipping_items-d.n)+' للشحن المجاني 🚚';
  } else { pct=100; label=d.free_shipping?'🎉 خصم كامل + شحن مجاني!':'🎉 وصلتم لأعلى خصم!'; }
  var col=lite?'#0a7a58':'#FFD98A';
  return '<div class="prog'+(lite?' lite':'')+'" style="margin-top:'+(lite?'9':'12')+'px"><i style="width:'+pct+'%"></i></div>'
    +'<div style="font-size:12px;color:'+col+';margin-top:9px;font-weight:700">'+(lite?'':'🔥 ')+label+'</div>';
}

function doJoin(){var n=($("jname")&&$("jname").value||"").trim();
  call("/lamma/group/join",{code:CODE,name:n}).then(function(d){if(d.error){toast("تعذّر الانضمام");return}toast("انضممت للّمة 🎉");render(d)})}
function addMine(){call("/lamma/group/import_session",{code:CODE}).then(function(d){
  if(d.error){location.href="/shop";return}
  var added=d.me&&d.me.n; if(!added){toast("ابنِ لمّتك من المتجر أولًا");setTimeout(function(){location.href="/shop"},900);return}
  toast("أُضيفت منتجاتك ✅");render(d)})}
function doLock(){if(!confirm("إقفال اللمّة وبدء الدفع؟"))return;call("/lamma/group/lock",{code:CODE}).then(function(d){toast("اللمّة جاهزة للدفع");render(d)})}
function doPay(){call("/lamma/group/pay",{code:CODE}).then(function(d){if(d.redirect){location.href=d.redirect}else{toast(d.error==="empty"?"أضِف منتجاتك أولًا":"تعذّر الدفع")}})}
function shareWA(){var t=encodeURIComponent("🧺 انضم للمّتي على يلو! كل ما نضيف أكثر نوفّر أكثر 👇\n"+(window.__D__.share_url||location.href));
  window.open("https://wa.me/?text="+t,"_blank")}
function copyLink(){var u=window.__D__.share_url||location.href;
  if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){toast("نُسخ الرابط ✅")})}else{prompt("انسخ الرابط:",u)}}

load();
setInterval(function(){if(document.visibilityState==="visible")load()},12000);
</script>
</body>
</html>
